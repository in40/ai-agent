server {
    listen 80;
    server_name vtbgpt.sorokinonline.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name vtbgpt.sorokinonline.com;

    ssl_certificate /etc/letsencrypt/live/vtbgpt.sorokinonline.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vtbgpt.sorokinonline.com/privkey.pem;

    client_max_body_size 100m;
    root /var/www/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location / {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ =404;
    }

    location /opencode {
        auth_basic "OpenCode Access";
        auth_basic_user_file /etc/nginx/.htpasswd-opencode;
        proxy_pass http://127.0.0.1:4096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
